[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyonfx"
dynamic = ["version"]
description = "An easy way to create KFX (Karaoke Effects) and complex typesetting using the ASS format (Advanced Substation Alpha)."
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
authors = [{ name = "Antonio Strippoli", email = "clarantonio98@gmail.com" }]
keywords = [
    "typesetting",
    "ass",
    "subtitle",
    "aegisub",
    "karaoke",
    "kfx",
    "advanced-substation-alpha",
    "karaoke-effect",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
]
dependencies = [
    "loguru>=0.7.3",
    "more_itertools>=10.8.0",
    "numpy>=2.0.0, <3.0.0",
    "pycairo>=1.29.0; sys_platform == 'linux' or sys_platform == 'darwin'",
    "PyGObject>=3.54.5; sys_platform == 'linux' or sys_platform == 'darwin'",
    "pywin32>=311; sys_platform == 'win32'",
    "typing_extensions>=4.15.0",
]

[project.optional-dependencies]
image = ["scikit-image>=0.25.0"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.15.0",
    "loguru-mypy>=0.0.4",
    "pytest>=9.0.0, <10.0.0",
    "pytest_check>=2.6.0",
    "sphinx-panels>=0.6.0",
    "sphinx-rtd-theme>=1.2.0",
    "pywin32-stubs>=1.0.7; sys_platform == 'win32'",
]

[tool.hatch.version]
path = "pyonfx/_metadata.py"

[tool.hatch.build.targets.wheel]
packages = ["pyonfx"]

[tool.mypy]
mypy_path = "./stubs/"
exclude_gitignore = true

# Flags changed by --strict
warn_return_any = false
extra_checks = false

# Misc
warn_unreachable = true

allow_redefinition_new = true
local_partial_types = true
implicit_reexport = false
strict = true

show_column_numbers = true
pretty = true
color_output = true
error_summary = true

[[tool.mypy.overrides]]
# Modules missing on Windows but needed on Linux/macOS
module = [
    "cairo",
    "gi",
    "gi.repository.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 140
extend-exclude = ["submodules"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "YTT",
    "ASYNC",
    "C4",
    "LOG",
    "G",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SIM",
    "I",
    "N",
    "PERF",
    "E",
    "W",
    "UP",
    "FURB",
    "RUF",
]
ignore = ["E741", "N806", "RUF001", "N803"]
