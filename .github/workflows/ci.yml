# Workflow label
name: CI

# Workflow trigger
on:
  push:
    branches:
      - overhaul/master
    paths:
      - "**.py"
      - ".github/**"
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - "**.py"
      - ".github/**"
      - pyproject.toml
      - uv.lock

# Workflow tasks
jobs:
  # Apply lint, check formatting
  lint:
    name: "Lint (${{matrix.os}}, Python ${{ matrix.python-version }})"
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install platform-specific requirements (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev gobject-introspection libcairo2-dev build-essential gir1.2-gtk-3.0 python3-gi python3-gi-cairo

      - name: Install platform-specific requirements (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install py3cairo pygobject3 pango cairo glib

      - name: Install dependencies
        run: uv sync

      - name: Running ruff
        run: uv run ruff check pyonfx tests

      - name: Running mypy
        run: uv run mypy pyonfx --python-version ${{ matrix.python-version }}

  # Execute pytest to check PyonFX's functionalities
  test:
    name: "Test (${{matrix.os}}, Python ${{ matrix.python-version }})"
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install platform-specific requirements (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0 python3-gi python3-gi-cairo

      - name: Install platform-specific requirements (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install py3cairo pygobject3 pango

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install fonts (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          go install github.com/Crosse/font-install@latest
          font-install "https://github.com/itouhiro/mixfont-mplus-ipa/releases/download/v2020.0307/migu-1p-20200307.zip"
        shell: bash

      - name: Install fonts (Windows)
        if: matrix.os == 'windows-latest'
        run: ./.github/scripts/install-fonts.ps1 'https://github.com/itouhiro/mixfont-mplus-ipa/releases/download/v2020.0307/migu-1p-20200307.zip'
        shell: pwsh

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: PANGOCAIRO_BACKEND=fc uv run pytest
        shell: bash
